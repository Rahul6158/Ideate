<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="idvyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Star Glow -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="50%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
  </defs>

  <!-- Circular background badge -->
  <rect width="120" height="120" rx="60" fill="url(#idvyBg)"/>
  
  <!-- Subtle inner ring -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#A78BFA" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Neural spark / connection nodes -->
  <circle cx="34" cy="40" r="3.5" fill="#E9D5FF" opacity="0.8"/>
  <circle cx="86" cy="40" r="3.5" fill="#E9D5FF" opacity="0.8"/>
  <circle cx="30" cy="74" r="3" fill="#C4B5FD" opacity="0.7"/>
  <circle cx="90" cy="74" r="3" fill="#C4B5FD" opacity="0.7"/>

  <!-- Synapse arcs connecting spark to central core -->
  <path d="M 34 40 Q 60 52 86 40" fill="none" stroke="#DDD6FE" stroke-width="1.8" stroke-dasharray="2,3" opacity="0.6"/>
  <path d="M 30 74 Q 60 62 90 74" fill="none" stroke="#DDD6FE" stroke-width="1.8" stroke-dasharray="2,3" opacity="0.6"/>

  <!-- Central Intelligence Core Spark (4-pointed star) -->
  <path d="M 60 26 
           C 60 44, 60 44, 78 60 
           C 60 76, 60 76, 60 94 
           C 60 76, 60 76, 42 60 
           C 60 44, 60 44, 60 26 Z" 
        fill="url(#starGrad)" 
        filter="url(#purpleGlow)"/>

  <!-- Secondary subtle rotating spark -->
  <path d="M 60 38 
           C 60 50, 60 50, 72 60 
           C 60 70, 60 70, 60 82 
           C 60 70, 60 70, 48 60 
           C 60 50, 60 50, 60 38 Z" 
        fill="#FFFFFF" 
        opacity="0.9"/>

  <!-- Core gleaming center -->
  <circle cx="60" cy="60" r="4.5" fill="#FFFFFF"/>
</svg>
